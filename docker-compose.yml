version: '3.8'

# Proje adı sabit: klasör adı ne olursa olsun aynı volume
# (hotel-reservation-system_pgdata) kullanılır, veri kaybolmaz.
name: hotel-reservation-system

services:
  db:
    image: postgres:15-alpine
    container_name: otel_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: otel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: