# Proje adı sabit: klasör adı ne olursa olsun aynı volume
# (hotel-reservation-system_pgdata) kullanılır, veri kaybolmaz.
name: hotel-reservation-system

services:
  db:
    image: postgres:15-alpine
    container_name: otel_postgres_db
    restart: always
    # Değerler backend/.env'den gelir:
    #   docker compose --env-file backend/.env up -d
    # Not: Bu değerler yalnızca volume İLK oluşturulurken uygulanır.
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS tanimli degil - docker compose --env-file backend/.env kullanin}
      POSTGRES_DB: ${DB_NAME:-otel_db}
    # Yalnızca bu bilgisayardan erişim (127.0.0.1); host portu .env'deki DB_PORT
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL bağlantı kabul ediyor mu? ($$ = değişkeni konteyner içindeki kabuk çözer)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: